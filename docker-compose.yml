name: maritime-surveillance

# Local infrastructure for development: PostgreSQL + PostGIS (the shared `ais_db`)
# and a single-node Kafka broker. The application services (meta-service,
# ingest-service, analytic-service, ui) run on the host and connect to
# localhost:5432 / localhost:9092.
#
#   docker compose up -d          # start
#   docker compose down           # stop (keeps data)
#   docker compose down -v        # stop and wipe (re-runs DB init on next up)

services:
  postgres:
    image: postgis/postgis:16-3.5
    container_name: ms-postgres
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-seren0Guard}
      POSTGRES_DB: ${DB_NAME:-ais_db}
    # If a local Postgres already owns 5432, put e.g. POSTGRES_HOST_PORT=5433 in a
    # ./.env file (and set DB_PORT=5433 in the service .env files to match).
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Init runs once, on an empty data dir, in filename order. The image's own
      # 10_postgis.sh enables PostGIS first; our files run after it.
      - ./meta-service/db/patches/2026-04-30-db-redesign.sql:/docker-entrypoint-initdb.d/20-ais-schema.sql:ro
      - ./meta-service/db/patches/2026-09-02-restricted-areas.sql:/docker-entrypoint-initdb.d/25-restricted-areas.sql:ro
      - ./meta-service/db/schema.sql:/docker-entrypoint-initdb.d/30-meta-schema.sql:ro
      - ./meta-service/db/seed.sql:/docker-entrypoint-initdb.d/40-meta-seed.sql:ro
      - ./meta-service/scripts/seed-permissions.sql:/docker-entrypoint-initdb.d/50-permissions.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-ais_db}"]
      interval: 5s
      timeout: 5s
      retries: 15

  kafka:
    image: apache/kafka:3.9.0
    container_name: ms-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      # EXTERNAL is what host processes use (localhost:9092 — matches the services'
      # .env KAFKA_BROKERS). INTERNAL is for other containers (kafka:19092).
      KAFKA_LISTENERS: CONTROLLER://:9093,INTERNAL://:19092,EXTERNAL://:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - kafkadata:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 15

  # One-shot: ensure the AIS topic exists (ingest-service also self-creates it).
  kafka-init:
    image: apache/kafka:3.9.0
    container_name: ms-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    command:
      - /opt/kafka/bin/kafka-topics.sh
      - --bootstrap-server
      - kafka:19092
      - --create
      - --if-not-exists
      - --topic
      - ais.raw.messages
      - --partitions
      - "1"
      - --replication-factor
      - "1"
    restart: "no"

volumes:
  pgdata:
  kafkadata:
