name: Deploy to Lightsail

# 1. build: the four app images are built on GitHub's runners (with layer cache) and pushed
#    to GHCR, tagged with the commit SHA.
# 2. deploy: the VM gets only the compose files, pulls the new images and restarts. Nothing is
#    built on the VM. Secrets live only in ~/serenguard/.env on the VM.
#
# Repository secret: LIGHTSAIL_SSH_KEY = private key whose public half is in the VM's
# ~/.ssh/authorized_keys for the ubuntu user (who is in the docker group).

on:
  push:
    branches: [main]
  workflow_dispatch:

# One run at a time; a newer push waits instead of interrupting a deploy.
concurrency:
  group: deploy-lightsail
  cancel-in-progress: false

env:
  # GHCR names must be lowercase; github.repository already is for this repo.
  IMAGE_REPO: ghcr.io/${{ github.repository }}
  IMAGE_TAG: ${{ github.sha }}
  SERVICES: meta-service ingest-service analytic-service web
  HOST: 13.237.194.79
  # Pinned host key of HOST (ssh-keyscan -t ed25519 <HOST>). Update it with HOST whenever the
  # VM is replaced, or every SSH step fails with "Host key verification failed".
  HOST_KEY: ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIK7G4duGH6sNZd2ll+i+7tyiXFy23io86f0AzIe+yFpH
  APP_DIR: serenguard

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service: [meta-service, ingest-service, analytic-service, web]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.service }}/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_REPO }}/${{ matrix.service }}:${{ env.IMAGE_TAG }}
            ${{ env.IMAGE_REPO }}/${{ matrix.service }}:latest
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up SSH
        env:
          SSH_KEY: ${{ secrets.LIGHTSAIL_SSH_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          # Strip Windows line endings and make sure the file ends with a newline; a pasted
          # key that has either problem fails with "error in libcrypto".
          printf '%s\n' "$SSH_KEY" | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          if ! ssh-keygen -l -f ~/.ssh/deploy_key; then
            echo "::error::LIGHTSAIL_SSH_KEY is not a valid private key ($(wc -l < ~/.ssh/deploy_key) lines). Paste the whole file, from -----BEGIN to -----END OPENSSH PRIVATE KEY-----."
            exit 1
          fi
          echo "$HOST $HOST_KEY" > ~/.ssh/known_hosts
          cat > ~/.ssh/config <<EOF
          Host lightsail
            HostName $HOST
            User ubuntu
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
            ServerAliveInterval 15
            ServerAliveCountMax 8
          EOF

      - name: Copy compose files
        run: rsync -az docker-compose.yml docker-compose.prod.yml "lightsail:~/$APP_DIR/"

      - name: Pull images and restart
        # The run's GITHUB_TOKEN (packages: read) is piped in on stdin, used for the pull and
        # logged out again. meta-service runs migrations on start.
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # shellcheck disable=SC2029
          # (IMAGE_*, SERVICES and APP_DIR are meant to expand on the runner.)
          echo "$TOKEN" | ssh lightsail "docker login ghcr.io -u ${{ github.actor }} --password-stdin"
          # shellcheck disable=SC2029
          ssh lightsail "cd ~/$APP_DIR && test -f .env \
            && export IMAGE_REPO=$IMAGE_REPO IMAGE_TAG=$IMAGE_TAG \
            && C='docker compose -f docker-compose.yml -f docker-compose.prod.yml' \
            && \$C pull --quiet $SERVICES && \$C up -d --no-build --remove-orphans; \
            s=\$?; docker logout ghcr.io >/dev/null; docker image prune -af --filter until=24h >/dev/null; exit \$s"

      - name: Check the site
        run: |
          ssh lightsail 'for i in $(seq 1 30); do
              web=$(curl -s -o /dev/null -w "%{http_code}" http://localhost/)
              api=$(curl -s -o /dev/null -w "%{http_code}" http://localhost/api/users/me)
              [ "$web" = 200 ] && [ "$api" = 401 ] && { echo "web $web, api $api (auth required): up"; exit 0; }
              sleep 5
            done
            echo "web $web, api $api: not healthy after 150 s"; exit 1'

      - name: Show status
        if: always()
        run: |
          # shellcheck disable=SC2029
          ssh lightsail "cd ~/$APP_DIR && docker compose -f docker-compose.yml -f docker-compose.prod.yml ps --format '{{.Service}} {{.Status}}'" || true
