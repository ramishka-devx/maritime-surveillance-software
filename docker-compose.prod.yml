# Production overlay. Secrets come from ./.env on the server (see .env.prod.example).
# CI (.github/workflows/deploy.yml) builds the app images, pushes them to GHCR and runs
#   IMAGE_REPO=ghcr.io/<owner>/<repo> IMAGE_TAG=<sha> docker compose -f docker-compose.yml -f docker-compose.prod.yml pull && ... up -d --no-build
# A manual deploy can still build on the VM: docker compose -f ... -f ... up -d --build
services:
  postgres:
    # Public so local dev can connect directly. Lock 5432 to known IPs in the Lightsail firewall.
    ports: !override ["5432:5432"]
    restart: unless-stopped

  kafka:
    ports: !reset []
    restart: unless-stopped
    environment:
      KAFKA_HEAP_OPTS: -Xmx256m -Xms256m

  meta-service:
    image: ${IMAGE_REPO:-serenguard}/meta-service:${IMAGE_TAG:-latest}
    build: { context: ., dockerfile: meta-service/Dockerfile }
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      NODE_ENV: production
      PORT: 5000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME:-ais_db}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: 1d
      PERMISSIONS_BYPASS: "false"
      # Every request reaches Express from the nginx container's IP, so this limit is shared.
      RATE_LIMIT_MAX: 2000

  ingest-service:
    image: ${IMAGE_REPO:-serenguard}/ingest-service:${IMAGE_TAG:-latest}
    build: { context: ., dockerfile: ingest-service/Dockerfile }
    restart: unless-stopped
    depends_on:
      kafka-init: { condition: service_completed_successfully }
      meta-service: { condition: service_started }
    environment:
      NODE_ENV: production
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME:-ais_db}
      AIS_STREAM_IO_API_KEY: ${AIS_STREAM_IO_API_KEY}
      KAFKA_ENABLED: "true"
      KAFKA_BROKERS: kafka:19092

  analytic-service:
    image: ${IMAGE_REPO:-serenguard}/analytic-service:${IMAGE_TAG:-latest}
    build: { context: ., dockerfile: analytic-service/Dockerfile }
    restart: unless-stopped
    depends_on:
      kafka-init: { condition: service_completed_successfully }
    environment:
      KAFKA_BROKERS: kafka:19092
      KAFKA_TOPIC: ais.raw.messages
      KAFKA_GROUP_ID: analytic-speed-anomalies
      META_SERVICE_URL: http://meta-service:5000
      META_SERVICE_TOKEN: ${META_SERVICE_TOKEN:-}
      ANOMALY_CONTAMINATION: "0.01"
      ANOMALY_N_ESTIMATORS: "200"
      ANOMALY_WINDOW_SIZE: "1000"
      ANOMALY_MIN_SAMPLES: "100"

  web:
    image: ${IMAGE_REPO:-serenguard}/web:${IMAGE_TAG:-latest}
    build: { context: ., dockerfile: web/Dockerfile }
    restart: unless-stopped
    depends_on: [meta-service]
    # Host nginx owns 80/443 (TLS for serenguard.online) and proxies to 127.0.0.1:8080.
    ports:
      - "127.0.0.1:8080:80"
